<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="nanoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
  </defs>
  <!-- PCB Board -->
  <rect x="50" y="50" width="100" height="100" rx="4" fill="url(#nanoGrad)"/>
  <!-- Mini USB Port -->
  <rect x="85" y="45" width="30" height="12" rx="2" fill="#424242"/>
  <!-- Chip -->
  <rect x="70" y="75" width="40" height="40" rx="2" fill="#37474f"/>
  <circle cx="77" cy="82" r="2" fill="#90a4ae"/>
  <!-- Pins - Left -->
  <g fill="#ffc107">
    <rect x="45" y="60" width="8" height="3"/>
    <rect x="45" y="70" width="8" height="3"/>
    <rect x="45" y="80" width="8" height="3"/>
    <rect x="45" y="90" width="8" height="3"/>
    <rect x="45" y="100" width="8" height="3"/>
    <rect x="45" y="110" width="8" height="3"/>
    <rect x="45" y="120" width="8" height="3"/>
    <rect x="45" y="130" width="8" height="3"/>
  </g>
  <!-- Pins - Right -->
  <g fill="#ffc107">
    <rect x="147" y="60" width="8" height="3"/>
    <rect x="147" y="70" width="8" height="3"/>
    <rect x="147" y="80" width="8" height="3"/>
    <rect x="147" y="90" width="8" height="3"/>
    <rect x="147" y="100" width="8" height="3"/>
    <rect x="147" y="110" width="8" height="3"/>
    <rect x="147" y="120" width="8" height="3"/>
    <rect x="147" y="130" width="8" height="3"/>
  </g>
  <!-- LEDs -->
  <circle cx="125" cy="65" r="3" fill="#4caf50"/>
  <circle cx="135" cy="65" r="3" fill="#f44336"/>
  <!-- Text -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#1976d2" font-weight="bold">Arduino NANO</text>
</svg>
