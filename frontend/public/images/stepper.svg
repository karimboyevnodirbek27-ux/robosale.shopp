<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="stepperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#212121"/>
      <stop offset="100%" style="stop-color:#424242"/>
    </linearGradient>
  </defs>
  <!-- Motor Body -->
  <rect x="40" y="50" width="120" height="100" rx="4" fill="url(#stepperGrad)"/>
  <!-- Motor Face -->
  <rect x="45" y="55" width="110" height="90" rx="2" fill="#37474f"/>
  <!-- Center Circle -->
  <circle cx="100" cy="100" r="30" fill="#546e7a"/>
  <circle cx="100" cy="100" r="20" fill="#37474f"/>
  <!-- Shaft -->
  <circle cx="100" cy="100" r="10" fill="#9e9e9e"/>
  <rect x="95" y="25" width="10" height="30" fill="#bdbdbd"/>
  <circle cx="100" cy="30" r="8" fill="#9e9e9e"/>
  <!-- Mounting Holes -->
  <circle cx="65" cy="75" r="5" fill="#263238"/>
  <circle cx="135" cy="75" r="5" fill="#263238"/>
  <circle cx="65" cy="125" r="5" fill="#263238"/>
  <circle cx="135" cy="125" r="5" fill="#263238"/>
  <!-- Connector -->
  <rect x="75" y="145" width="50" height="15" rx="2" fill="#37474f"/>
  <!-- Wires -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M85 160 L85 180" stroke="#ef5350"/>
    <path d="M95 160 L95 180" stroke="#2196f3"/>
    <path d="M105 160 L105 180" stroke="#4caf50"/>
    <path d="M115 160 L115 180" stroke="#212121"/>
  </g>
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="#424242" font-weight="bold">NEMA 17</text>
</svg>
