<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="megaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
  </defs>
  <!-- PCB Board -->
  <rect x="10" y="30" width="180" height="140" rx="6" fill="url(#megaGrad)"/>
  <!-- USB Port -->
  <rect x="15" y="85" width="25" height="30" rx="2" fill="#424242"/>
  <rect x="20" y="90" width="15" height="20" fill="#212121"/>
  <!-- Power Jack -->
  <circle cx="175" cy="100" r="12" fill="#424242"/>
  <circle cx="175" cy="100" r="6" fill="#212121"/>
  <!-- Main Chip -->
  <rect x="60" y="60" width="60" height="60" rx="2" fill="#37474f"/>
  <circle cx="70" cy="70" r="4" fill="#90a4ae"/>
  <!-- Second Chip -->
  <rect x="130" y="45" width="30" height="30" rx="2" fill="#37474f"/>
  <!-- Pins - Top Row 1 -->
  <g fill="#ffc107">
    <rect x="25" y="25" width="3" height="8"/>
    <rect x="32" y="25" width="3" height="8"/>
    <rect x="39" y="25" width="3" height="8"/>
    <rect x="46" y="25" width="3" height="8"/>
    <rect x="53" y="25" width="3" height="8"/>
    <rect x="60" y="25" width="3" height="8"/>
    <rect x="67" y="25" width="3" height="8"/>
    <rect x="74" y="25" width="3" height="8"/>
  </g>
  <!-- Pins - Bottom -->
  <g fill="#ffc107">
    <rect x="25" y="167" width="3" height="8"/>
    <rect x="32" y="167" width="3" height="8"/>
    <rect x="39" y="167" width="3" height="8"/>
    <rect x="46" y="167" width="3" height="8"/>
    <rect x="53" y="167" width="3" height="8"/>
    <rect x="60" y="167" width="3" height="8"/>
    <rect x="67" y="167" width="3" height="8"/>
    <rect x="74" y="167" width="3" height="8"/>
    <rect x="81" y="167" width="3" height="8"/>
    <rect x="88" y="167" width="3" height="8"/>
    <rect x="95" y="167" width="3" height="8"/>
    <rect x="102" y="167" width="3" height="8"/>
  </g>
  <!-- LEDs -->
  <circle cx="145" cy="140" r="4" fill="#4caf50"/>
  <circle cx="155" cy="140" r="4" fill="#f44336"/>
  <circle cx="165" cy="140" r="4" fill="#ffeb3b"/>
  <!-- Text -->
  <text x="100" y="192" text-anchor="middle" font-family="Arial" font-size="10" fill="#1565c0" font-weight="bold">Arduino MEGA</text>
</svg>
