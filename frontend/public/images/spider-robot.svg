<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="spiderBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c4dff"/>
      <stop offset="100%" style="stop-color:#651fff"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="100" cy="100" rx="35" ry="25" fill="url(#spiderBodyGrad)"/>
  <!-- Head -->
  <ellipse cx="100" cy="70" rx="20" ry="15" fill="url(#spiderBodyGrad)"/>
  <!-- Eyes -->
  <circle cx="93" cy="65" r="5" fill="#f44336"/>
  <circle cx="107" cy="65" r="5" fill="#f44336"/>
  <circle cx="93" cy="65" r="2" fill="#fff"/>
  <circle cx="107" cy="65" r="2" fill="#fff"/>
  <!-- Legs - Left Side -->
  <g fill="none" stroke="#512da8" stroke-width="5" stroke-linecap="round">
    <path d="M70 90 L45 70 L25 85"/>
    <path d="M70 100 L40 100 L20 110"/>
    <path d="M70 110 L45 130 L25 125"/>
    <path d="M75 120 L55 150 L35 160"/>
  </g>
  <!-- Legs - Right Side -->
  <g fill="none" stroke="#512da8" stroke-width="5" stroke-linecap="round">
    <path d="M130 90 L155 70 L175 85"/>
    <path d="M130 100 L160 100 L180 110"/>
    <path d="M130 110 L155 130 L175 125"/>
    <path d="M125 120 L145 150 L165 160"/>
  </g>
  <!-- Joints -->
  <g fill="#7c4dff">
    <circle cx="45" cy="70" r="4"/>
    <circle cx="40" cy="100" r="4"/>
    <circle cx="45" cy="130" r="4"/>
    <circle cx="55" cy="150" r="4"/>
    <circle cx="155" cy="70" r="4"/>
    <circle cx="160" cy="100" r="4"/>
    <circle cx="155" cy="130" r="4"/>
    <circle cx="145" cy="150" r="4"/>
  </g>
  <!-- Servo boxes on body -->
  <rect x="85" y="90" width="12" height="8" rx="1" fill="#37474f"/>
  <rect x="103" y="90" width="12" height="8" rx="1" fill="#37474f"/>
  <rect x="85" y="102" width="12" height="8" rx="1" fill="#37474f"/>
  <rect x="103" y="102" width="12" height="8" rx="1" fill="#37474f"/>
  <!-- Label -->
  <text x="100" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#651fff" font-weight="bold">Spider Robot</text>
</svg>
