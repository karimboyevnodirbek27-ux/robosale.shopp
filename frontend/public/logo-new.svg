<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <defs>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="50%" style="stop-color:#00A3FF"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#0066FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Robot Icon -->
  <g transform="translate(3, 2)">
    <!-- Antenna -->
    <circle cx="22" cy="3" r="2.5" fill="url(#glowGradient)" filter="url(#glow)"/>
    <rect x="21" y="5" width="2" height="5" rx="1" fill="url(#robotGradient)"/>
    
    <!-- Head - Main body with gradient -->
    <rect x="6" y="10" width="32" height="24" rx="6" fill="url(#robotGradient)"/>
    
    <!-- Face screen - dark background -->
    <rect x="9" y="13" width="26" height="18" rx="4" fill="#0a1628"/>
    
    <!-- Eyes - Glowing cyan -->
    <ellipse cx="16" cy="20" rx="3" ry="3.5" fill="url(#glowGradient)" filter="url(#glow)"/>
    <ellipse cx="28" cy="20" rx="3" ry="3.5" fill="url(#glowGradient)" filter="url(#glow)"/>
    
    <!-- Eye highlights -->
    <circle cx="17" cy="19" r="1" fill="#fff" opacity="0.8"/>
    <circle cx="29" cy="19" r="1" fill="#fff" opacity="0.8"/>
    
    <!-- Smile -->
    <path d="M15 26 Q22 31 29 26" stroke="url(#glowGradient)" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Body -->
    <rect x="10" y="36" width="24" height="8" rx="3" fill="url(#robotGradient)"/>
    
    <!-- Body details - tech lines -->
    <line x1="14" y1="40" x2="18" y2="40" stroke="#0a1628" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="40" x2="30" y2="40" stroke="#0a1628" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="22" cy="40" r="1.5" fill="#0a1628"/>
    
    <!-- Arms -->
    <ellipse cx="3" cy="26" rx="3" ry="4" fill="url(#robotGradient)"/>
    <ellipse cx="41" cy="26" rx="3" ry="4" fill="url(#robotGradient)"/>
  </g>
</svg>
