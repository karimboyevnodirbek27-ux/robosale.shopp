<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="dhtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
  </defs>
  <!-- Sensor Body -->
  <rect x="40" y="40" width="120" height="100" rx="6" fill="url(#dhtGrad)"/>
  <!-- Grid Pattern -->
  <g fill="none" stroke="#1565c0" stroke-width="1">
    <line x1="50" y1="55" x2="50" y2="125"/>
    <line x1="60" y1="55" x2="60" y2="125"/>
    <line x1="70" y1="55" x2="70" y2="125"/>
    <line x1="80" y1="55" x2="80" y2="125"/>
    <line x1="90" y1="55" x2="90" y2="125"/>
    <line x1="100" y1="55" x2="100" y2="125"/>
    <line x1="110" y1="55" x2="110" y2="125"/>
    <line x1="120" y1="55" x2="120" y2="125"/>
    <line x1="130" y1="55" x2="130" y2="125"/>
    <line x1="140" y1="55" x2="140" y2="125"/>
    <line x1="150" y1="55" x2="150" y2="125"/>
  </g>
  <!-- Window -->
  <rect x="100" y="55" width="50" height="70" rx="4" fill="#e3f2fd"/>
  <rect x="105" y="60" width="40" height="60" rx="2" fill="#bbdefb"/>
  <!-- Pins -->
  <g fill="#ffc107">
    <rect x="58" y="135" width="4" height="20"/>
    <rect x="78" y="135" width="4" height="20"/>
    <rect x="98" y="135" width="4" height="20"/>
    <rect x="118" y="135" width="4" height="20"/>
  </g>
  <!-- Label -->
  <text x="100" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="#1976d2" font-weight="bold">DHT11</text>
</svg>
