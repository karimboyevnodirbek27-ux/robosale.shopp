<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
  </defs>
  
  <!-- Robot Head Only for Favicon -->
  <g transform="translate(2, 2)">
    <!-- Antenna -->
    <circle cx="14" cy="2" r="2" fill="#60A5FA"/>
    <rect x="13" y="3" width="2" height="4" fill="#2563EB"/>
    
    <!-- Head -->
    <rect x="2" y="6" width="24" height="20" rx="4" fill="url(#favGradient)"/>
    <rect x="5" y="9" width="18" height="14" rx="2" fill="#0F172A"/>
    
    <!-- Eyes -->
    <rect x="8" y="12" width="3" height="3" fill="#60A5FA"/>
    <rect x="17" y="12" width="3" height="3" fill="#60A5FA"/>
    
    <!-- Smile -->
    <path d="M10 19 Q14 22 18 19" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
