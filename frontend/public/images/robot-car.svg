<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90a4ae"/>
      <stop offset="100%" style="stop-color:#607d8b"/>
    </linearGradient>
  </defs>
  <!-- Chassis -->
  <rect x="40" y="70" width="120" height="80" rx="8" fill="url(#chassisGrad)"/>
  <!-- Top Platform -->
  <rect x="50" y="60" width="100" height="20" rx="4" fill="#78909c"/>
  <!-- Wheels -->
  <ellipse cx="35" cy="90" rx="15" ry="25" fill="#212121"/>
  <ellipse cx="35" cy="90" rx="10" ry="20" fill="#424242"/>
  <ellipse cx="35" cy="130" rx="15" ry="25" fill="#212121"/>
  <ellipse cx="35" cy="130" rx="10" ry="20" fill="#424242"/>
  <ellipse cx="165" cy="90" rx="15" ry="25" fill="#212121"/>
  <ellipse cx="165" cy="90" rx="10" ry="20" fill="#424242"/>
  <ellipse cx="165" cy="130" rx="15" ry="25" fill="#212121"/>
  <ellipse cx="165" cy="130" rx="10" ry="20" fill="#424242"/>
  <!-- Arduino on top -->
  <rect x="60" y="45" width="40" height="25" rx="2" fill="#1565c0"/>
  <!-- Ultrasonic Sensor -->
  <circle cx="130" cy="55" r="8" fill="#e0e0e0"/>
  <circle cx="145" cy="55" r="8" fill="#e0e0e0"/>
  <!-- Battery -->
  <rect x="70" y="80" width="60" height="30" rx="2" fill="#4caf50"/>
  <text x="100" y="100" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">BATTERY</text>
  <!-- Motor Driver -->
  <rect x="65" y="115" width="35" height="25" rx="2" fill="#e53935"/>
  <rect x="105" y="115" width="35" height="25" rx="2" fill="#e53935"/>
  <!-- Label -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#37474f" font-weight="bold">4WD Robot Car</text>
</svg>
