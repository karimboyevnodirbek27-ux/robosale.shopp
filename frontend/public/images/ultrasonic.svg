<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#0097a7"/>
    </linearGradient>
  </defs>
  <!-- PCB Board -->
  <rect x="30" y="60" width="140" height="80" rx="4" fill="url(#sensorGrad)"/>
  <!-- Ultrasonic Transducers -->
  <circle cx="70" cy="100" r="28" fill="#e0e0e0"/>
  <circle cx="70" cy="100" r="22" fill="#9e9e9e"/>
  <circle cx="70" cy="100" r="16" fill="#757575"/>
  <circle cx="70" cy="100" r="8" fill="#424242"/>
  
  <circle cx="130" cy="100" r="28" fill="#e0e0e0"/>
  <circle cx="130" cy="100" r="22" fill="#9e9e9e"/>
  <circle cx="130" cy="100" r="16" fill="#757575"/>
  <circle cx="130" cy="100" r="8" fill="#424242"/>
  <!-- Crystal -->
  <rect x="90" y="70" width="20" height="10" rx="2" fill="#90a4ae"/>
  <!-- Pins -->
  <g fill="#ffc107">
    <rect x="50" y="135" width="4" height="15"/>
    <rect x="70" y="135" width="4" height="15"/>
    <rect x="90" y="135" width="4" height="15"/>
    <rect x="110" y="135" width="4" height="15"/>
  </g>
  <!-- Pin Labels -->
  <text x="52" y="165" font-family="Arial" font-size="8" fill="#424242">VCC</text>
  <text x="70" y="165" font-family="Arial" font-size="8" fill="#424242">TRIG</text>
  <text x="88" y="165" font-family="Arial" font-size="8" fill="#424242">ECHO</text>
  <text x="108" y="165" font-family="Arial" font-size="8" fill="#424242">GND</text>
  <!-- Label -->
  <text x="100" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#0097a7" font-weight="bold">HC-SR04</text>
</svg>
