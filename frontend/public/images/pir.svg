<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="pirGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
  </defs>
  <!-- PCB Board -->
  <rect x="50" y="100" width="100" height="60" rx="4" fill="url(#pirGrad)"/>
  <!-- Dome Lens -->
  <circle cx="100" cy="80" r="50" fill="#f5f5f5" opacity="0.9"/>
  <circle cx="100" cy="80" r="40" fill="#e0e0e0"/>
  <circle cx="100" cy="80" r="30" fill="#bdbdbd"/>
  <circle cx="100" cy="80" r="15" fill="#757575"/>
  <!-- Sensor Element -->
  <rect x="90" y="70" width="20" height="20" fill="#424242"/>
  <!-- Potentiometers -->
  <circle cx="70" cy="125" r="8" fill="#ff9800"/>
  <line x1="70" y1="120" x2="70" y2="130" stroke="#fff" stroke-width="2"/>
  <circle cx="130" cy="125" r="8" fill="#ff9800"/>
  <line x1="125" y1="125" x2="135" y2="125" stroke="#fff" stroke-width="2"/>
  <!-- Pins -->
  <g fill="#ffc107">
    <rect x="68" y="155" width="4" height="15"/>
    <rect x="88" y="155" width="4" height="15"/>
    <rect x="108" y="155" width="4" height="15"/>
  </g>
  <!-- Pin Labels -->
  <text x="70" y="180" text-anchor="middle" font-family="Arial" font-size="7" fill="#424242">VCC</text>
  <text x="90" y="180" text-anchor="middle" font-family="Arial" font-size="7" fill="#424242">OUT</text>
  <text x="110" y="180" text-anchor="middle" font-family="Arial" font-size="7" fill="#424242">GND</text>
</svg>
