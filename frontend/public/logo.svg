<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0D2137"/>
    </linearGradient>
  </defs>
  
  <!-- Robot Head -->
  <rect x="14" y="2" width="20" height="16" rx="3" fill="url(#darkGrad)" stroke="url(#blueGrad)" stroke-width="1.5"/>
  
  <!-- Antenna -->
  <line x1="24" y1="2" x2="24" y2="-1" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="-2" r="2" fill="#00D4FF">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Robot Eyes -->
  <circle cx="19" cy="8" r="2.5" fill="#0a0a12" stroke="#00D4FF" stroke-width="1"/>
  <circle cx="19" cy="8" r="1.2" fill="#00D4FF">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="29" cy="8" r="2.5" fill="#0a0a12" stroke="#00D4FF" stroke-width="1"/>
  <circle cx="29" cy="8" r="1.2" fill="#00D4FF">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  
  <!-- Robot Smile -->
  <path d="M20 14 Q24 17 28 14" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Robot Body -->
  <rect x="16" y="20" width="16" height="12" rx="2" fill="url(#darkGrad)" stroke="url(#blueGrad)" stroke-width="1.5"/>
  
  <!-- Body Details -->
  <circle cx="24" cy="26" r="3" stroke="#00D4FF" stroke-width="1" fill="none"/>
  <circle cx="24" cy="26" r="1" fill="#00D4FF"/>
  
  <!-- Left Arm holding Arduino -->
  <path d="M16 22 L8 26 L8 36" stroke="url(#blueGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Arm holding Arduino -->
  <path d="M32 22 L40 26 L40 36" stroke="url(#blueGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arduino UNO Board (held by robot) -->
  <rect x="6" y="36" width="36" height="10" rx="1.5" fill="url(#darkGrad)" stroke="#0066FF" stroke-width="1.2"/>
  
  <!-- Arduino Chip -->
  <rect x="18" y="38" width="12" height="6" rx="1" fill="#0a0a12" stroke="#00D4FF" stroke-width="0.7"/>
  
  <!-- Arduino Pins Top -->
  <rect x="8" y="36" width="1.5" height="2.5" fill="#00D4FF"/>
  <rect x="11" y="36" width="1.5" height="2.5" fill="#00D4FF"/>
  <rect x="14" y="36" width="1.5" height="2.5" fill="#00D4FF"/>
  <rect x="32" y="36" width="1.5" height="2.5" fill="#00D4FF"/>
  <rect x="35" y="36" width="1.5" height="2.5" fill="#00D4FF"/>
  <rect x="38" y="36" width="1.5" height="2.5" fill="#00D4FF"/>
  
  <!-- USB Port -->
  <rect x="8" y="40" width="5" height="4" rx="0.5" fill="#00D4FF" opacity="0.8"/>
  
  <!-- Power Port -->
  <rect x="35" y="40" width="5" height="3" rx="0.5" fill="#00D4FF" opacity="0.6"/>
  
  <!-- LED indicators on Arduino -->
  <circle cx="31" cy="41" r="1" fill="#00FF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="31" cy="44" r="1" fill="#FF6600">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>
