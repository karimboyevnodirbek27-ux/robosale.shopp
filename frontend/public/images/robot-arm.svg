<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="armBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <ellipse cx="100" cy="175" rx="50" ry="15" fill="#424242"/>
  <rect x="60" y="155" width="80" height="20" fill="#616161"/>
  <ellipse cx="100" cy="155" rx="40" ry="12" fill="#757575"/>
  <!-- Rotating Base -->
  <rect x="85" y="130" width="30" height="30" rx="4" fill="url(#armBaseGrad)"/>
  <!-- First Arm -->
  <rect x="90" y="70" width="20" height="65" rx="4" fill="url(#armBaseGrad)"/>
  <!-- Joint 1 -->
  <circle cx="100" cy="130" r="12" fill="#ff5722"/>
  <circle cx="100" cy="130" r="6" fill="#bf360c"/>
  <!-- Second Arm -->
  <rect x="75" y="35" width="50" height="15" rx="4" fill="url(#armBaseGrad)" transform="rotate(-25 100 70)"/>
  <!-- Joint 2 -->
  <circle cx="100" cy="70" r="10" fill="#ff5722"/>
  <circle cx="100" cy="70" r="5" fill="#bf360c"/>
  <!-- Gripper -->
  <rect x="125" y="25" width="25" height="8" rx="2" fill="#455a64"/>
  <rect x="125" y="37" width="25" height="8" rx="2" fill="#455a64"/>
  <rect x="145" y="22" width="8" height="10" rx="1" fill="#37474f"/>
  <rect x="145" y="38" width="8" height="10" rx="1" fill="#37474f"/>
  <!-- Wrist Joint -->
  <circle cx="125" cy="35" r="8" fill="#ff5722"/>
  <!-- Servos visualization -->
  <rect x="45" y="140" width="15" height="20" rx="2" fill="#263238"/>
  <rect x="140" y="140" width="15" height="20" rx="2" fill="#263238"/>
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" font-family="Arial" font-size="10" fill="#f57c00" font-weight="bold">Robot Arm 6DOF</text>
</svg>
